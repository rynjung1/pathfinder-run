[pytest]
# Checked pytest's current docs before picking this over pyproject.toml:
# both are supported, but a pyproject.toml would imply this is a
# packaged/installable project, which scripts/ isn't (it's a flat
# collection of top-level modules -- see tests/conftest.py). Plain
# pytest.ini stays minimal and matches what's actually here.
testpaths = tests
addopts = -ra
